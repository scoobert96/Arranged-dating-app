        ${votingOpen ? `<br><span style="font-size:13px;font-weight:400;font-family:Inter,sans-serif;opacity:0.8">Tap below to change your vote</span>` : ''}
      </div>`
    : votingOpen
      ? `<p style="text-align:center;font-size:13px;color:var(--ink-muted);margin-top:12px">Cast your vote for ${friend.name}</p>`
      : `<p style="text-align:center;font-size:13px;color:var(--ink-muted);margin-top:12px">Voting window closed — no vote recorded from you.</p>`;

  const myComment = State.advisingComments[matchObj.matchId];

  // Build vote panel content (visible when voted OR window closed)
  const canShowPanel = (voted || !votingOpen) && matchObj.mockAdvisors;
  let votePanelOverlay = '';
  let viewVotesPill = '';

  if (canShowPanel) {
    const allRows = [...matchObj.mockAdvisors, ...(voted ? [{
      id: 'you', name: 'You', avatar: 'https://randomuser.me/api/portraits/lego/1.jpg',
      vote: vote, comment: myComment || null, isYou: true
    }] : [])];
    const totalVoted    = allRows.filter(a => a.vote !== 'pending').length;
    const totalApproved = allRows.filter(a => a.vote === 'approved').length;
    const totalRejected = allRows.filter(a => a.vote === 'rejected').length;

    const rows = allRows.map(a => {
      const chip = a.vote === 'pending'
        ? `<span class="advising-vote-chip" style="background:var(--beige-mid);color:var(--ink-muted)">⏳ Waiting</span>`
        : a.vote === 'approved'
          ? `<span class="advising-vote-chip approved">👍 Approved</span>`
          : `<span class="advising-vote-chip rejected">👎 Passed</span>`;
      const replyKey = matchObj.matchId + '_' + a.id;
      const existingReply = State.advisingReplies[replyKey];
      const commentBlock = a.comment ? `
        <div class="vote-panel-comment">"${a.comment}"</div>
        ${existingReply
          ? `<div class="vote-panel-reply">↩ You: "${existingReply}"</div>`
          : !a.isYou ? `<div class="reply-input-row">
              <input class="reply-input" id="ri-${replyKey}" placeholder="Reply…">
              <button class="reply-btn" onclick="addAdvisingReply('${matchObj.matchId}','${a.id}',document.getElementById('ri-${replyKey}').value)">↑</button>
            </div>` : ''
        }` : '';
      return `
        <div class="vote-panel-row">
          <img class="vote-panel-avatar" src="${a.avatar}" alt="${a.name}">
          <div class="vote-panel-info">
            <div style="display:flex;align-items:center;justify-content:space-between">
              <span class="vote-panel-name">${a.name}${a.isYou ? ' <span style="font-size:10px;background:var(--teal-light);color:var(--teal);padding:1px 6px;border-radius:10px;font-weight:600">you</span>' : ''}</span>
              ${chip}
            </div>
            ${commentBlock}
          </div>
        </div>`;
    }).join('');

    if (State.advisingVotePanelOpen) {
      votePanelOverlay = `
        <div class="advising-vote-overlay">
          <div class="advising-vote-overlay-handle"></div>
          <div class="advising-vote-overlay-header">
            <span class="advising-vote-overlay-title">Friend votes</span>
            <button class="btn-close-overlay" data-action="close-advising-vote-panel">✕</button>
          </div>
          <div style="padding:0 16px 4px">
            ${renderVoteBar(totalApproved, totalRejected, allRows.length)}
          </div>
          <div style="padding:0 4px">${rows}</div>
        </div>`;
    } else {
      viewVotesPill = `<button class="view-votes-pill" data-action="open-advising-vote-panel">📊 View Votes</button>`;
    }
  }

  const actionBtns = votingOpen ? `
    <div class="rec-action-row">
      <button class="btn-thumb btn-thumb-down" data-action="advising-reject"  data-id="${matchObj.matchId}">👎</button>
      <button class="btn-thumb btn-thumb-up"   data-action="advising-approve" data-id="${matchObj.matchId}">👍</button>
    </div>` : '';

  return `
    <div class="rec-detail-screen" style="position:relative">
      <div class="profile-card">
        <div class="photo-area" data-advising-match-id="${matchObj.matchId}">
          <img src="${p.photos[photoIdx]}" alt="${p.name}">
          <div class="photo-overlay">
            <div class="photo-tap-left"  data-action="prev-advising-photo" data-id="${matchObj.matchId}"></div>
            <div class="photo-tap-right" data-action="next-advising-photo" data-id="${matchObj.matchId}"></div>
          </div>
          <div class="photo-dots">${dots}</div>
          <div class="profile-name-overlay">
            <h1>${p.name}, ${p.age}</h1>
            <p class="profile-city">📍 ${p.city}</p>
          </div>
        </div>
        <div class="profile-body">
          <p class="profile-bio">"${p.bio}"</p>
          ${prompts}
          <div class="profile-tags">${tags}</div>
        </div>
      </div>
      ${countdownBar}
      ${voteArea}
      ${actionBtns}
      ${viewVotesPill}
      ${votePanelOverlay}
    </div>`;
}

// ══════════════════════════════════════════════
/* ── Chat screen ── */
function renderChat() {
  const match = getMatch(State.chatMatchId);
  if (!match) return '';
  const p = match.profile;
  const bfName = State.bestFriendId ? FRIEND_NAMES[State.bestFriendId - 1] : null;

  const shareBar = State.chatBFShared
    ? `<div class="chat-share-bar shared">
        <span class="chat-share-text">👀 ${bfName} is following this chat</span>
      </div>`
    : `<div class="chat-share-bar">
        <span class="chat-share-text">🤝 ${bfName ? `Let ${bfName} follow along?` : 'Share with your Best Friend?'}</span>
        <button class="btn-share" data-action="open-chat-share">Share</button>
      </div>`;

  // Seeded mock messages based on match id for demo variety
  const seed = p.id % 3;
  const convos = [
    [
      { from: 'them', text: `Hey! I was so happy when I saw we matched 😊` },
      { from: 'me',   text: `Me too honestly! Your bio made me laugh.` },
      { from: 'them', text: `Ha, which part? The one about birds? Because I stand by it.` },
      { from: 'me',   text: `No the part where you said "chronically over-caffeinated." Me too.` },
      { from: 'them', text: `Okay we are clearly meant to be. Coffee date?` },
    ],
    [
      { from: 'them', text: `Hi! Okay I have to ask — what's your go-to pour-over ratio?` },
      { from: 'me',   text: `1:15 but I've been experimenting with 1:16 lately. High stakes stuff.` },
      { from: 'them', text: `This is already the best conversation I've had on any app.` },
      { from: 'me',   text: `We can settle the debate in person? I know a place.` },
    ],
    [
      { from: 'them', text: `I saw your profile and thought: this person gets it.` },
      { from: 'me',   text: `Gets what exactly? lol` },
      { from: 'them', text: `Just like… the importance of having opinions about things.` },
      { from: 'me',   text: `Okay that's either very deep or very vague.` },
      { from: 'them', text: `Maybe both? I'll explain over dinner.` },
    ],
  ];
  const msgs = convos[seed].map(msg => `
    <div style="display:flex;flex-direction:column;${msg.from === 'me' ? 'align-items:flex-end' : 'align-items:flex-start'}">
      ${msg.from === 'them' ? `<div class="chat-bubble-name">${p.name}</div>` : ''}
      <div class="chat-bubble ${msg.from}">${msg.text}</div>
    </div>`).join('');

  return `
    <div class="chat-screen">
      ${shareBar}
      <div class="chat-messages">${msgs}</div>
      <div class="chat-input-row">
        <input class="chat-input" placeholder="Type a message…" type="text">
        <button class="chat-send-btn">↑</button>
      </div>
    </div>`;
}

// TOUCH SWIPE — PHOTO NAVIGATION
// ══════════════════════════════════════════════

let _touchStartX = 0;
let _touchStartY = 0;
let _touchPhotoEl = null;

document.addEventListener('touchstart', e => {
  _touchStartX = e.touches[0].clientX;
  _touchStartY = e.touches[0].clientY;
  _touchPhotoEl = e.target.closest('.photo-area');
}, { passive: true });

document.addEventListener('touchend', e => {
  if (!_touchPhotoEl) return;
  const dx = e.changedTouches[0].clientX - _touchStartX;
  const dy = e.changedTouches[0].clientY - _touchStartY;
  if (Math.abs(dx) < 35 || Math.abs(dy) > Math.abs(dx) * 0.8) { _touchPhotoEl = null; return; }

  if (_touchPhotoEl.dataset.advisingMatchId) {
    const mid = _touchPhotoEl.dataset.advisingMatchId;
    if (dx < 0) nextAdvisingPhoto(mid); else prevAdvisingPhoto(mid);
  } else if (_touchPhotoEl.dataset.profileId) {
    const pid = parseInt(_touchPhotoEl.dataset.profileId);
    if (dx < 0) nextPhoto(pid); else prevPhoto(pid);
  }
  _touchPhotoEl = null;
}, { passive: true });

// ══════════════════════════════════════════════
// EVENT DELEGATION
// ══════════════════════════════════════════════

document.addEventListener('click', e => {
  // Backdrop click dismisses any open modal
  if (e.target.classList.contains('modal-overlay')) {
    if (State.confirmingBestFriendId !== null) cancelBestFriendConfirm();
    else if (State.confirmingModeSwitch) cancelModeSwitch();
    else if (State.showChatShareModal) cancelChatShare();
    else if (State.showAdvisingCommentModal) skipAdvisingComment();
    return;
  }

  const el     = e.target.closest('[data-action]');
  if (!el) return;
  const action = el.dataset.action;
  const id     = el.dataset.id;

  switch (action) {
    case 'select-dating':          selectMode('dating');              break;
    case 'select-recommending':    selectMode('recommending');        break;
    case 'toggle-mode':            toggleMode();                      break;
    case 'like':                   likeProfile();                     break;
    case 'pass':                   passProfile();                     break;
    case 'next-photo':             nextPhoto(parseInt(id));           break;
    case 'prev-photo':             prevPhoto(parseInt(id));           break;
    case 'see-votes':              goToApproval(id);                  break;
    case 'keep-swiping':           keepSwiping();                     break;
    case 'back':                   goToScreen('matches');             break;
    case 'go-discovery':           goToScreen('discovery');           break;
    case 'go-matches':             goToScreen('matches');             break;
    case 'go-friends-list':        goToScreen('friends-list');        break;
    case 'go-advising-friends':    goToScreen('advising-friends');    break;
    case 'open-approval':          goToApproval(id);                  break;
    case 'simulate-vote':          simulateVote(id);                  break;
    case 'set-best-friend':        setBestFriend(parseInt(id));       break;
    case 'remove-best-friend':     removeBestFriend();                break;
    case 'confirm-bf':             confirmBestFriend(parseInt(id));   break;
    case 'cancel-bf-confirm':      cancelBestFriendConfirm();         break;
    case 'accept-bf-request':      acceptBFRequest();                 break;
    case 'confirm-mode-switch':    confirmModeSwitch();               break;
    case 'cancel-mode-switch':     cancelModeSwitch();                break;
    case 'open-chat':              openChat(id);                      break;
    case 'skip-voting-window':     skipVotingWindow(id);              break;
    case 'back-from-chat':         goToScreen('matches');             break;
    case 'open-chat-share':        openChatShareModal();              break;
    case 'confirm-chat-share':     confirmChatShare();                break;
    case 'cancel-chat-share':      cancelChatShare();                 break;
    case 'submit-advising-comment': {
      const ta = document.getElementById('advising-comment-input');
      submitAdvisingComment(ta ? ta.value.trim() : '');
      break;
    }
    case 'skip-advising-comment':  skipAdvisingComment();             break;
    case 'add-friend':             openAddFriend();                   break;
    case 'open-advising-friend':   openAdvisingFriend(id);            break;
    case 'open-advising-match':    openAdvisingMatch(id);             break;
    case 'back-advising-matches':  backFromAdvisingMatches();         break;
    case 'back-advising-detail':   backFromAdvisingDetail();          break;
    case 'next-advising-photo':    nextAdvisingPhoto(id);             break;
    case 'prev-advising-photo':    prevAdvisingPhoto(id);             break;
    case 'advising-approve':       voteAdvisingMatch(id, 'approved'); break;
    case 'advising-reject':        voteAdvisingMatch(id, 'rejected'); break;
    case 'open-advising-vote-panel':  State.advisingVotePanelOpen = true;  render(); break;
    case 'close-advising-vote-panel': State.advisingVotePanelOpen = false; render(); break;
  }
});

// ══════════════════════════════════════════════
// BOOT
// ══════════════════════════════════════════════
render();
</script>
